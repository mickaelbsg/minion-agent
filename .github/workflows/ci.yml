name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test
        run: go test ./... -v

      - name: Build
        run: go build ./cmd/minion

      - name: Validate official Debian installer
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh

          if bash ./install.sh >/tmp/minion-install.out 2>/tmp/minion-install.err; then
            echo "install.sh accepted execution without a package" >&2
            exit 1
          fi
          grep -Fq 'O pacote Debian é o único artefato oficial' /tmp/minion-install.err || {
            echo "install.sh did not print the official-package usage message" >&2
            cat /tmp/minion-install.err >&2
            exit 1
          }

          touch /tmp/not-a-package.txt
          if bash ./install.sh /tmp/not-a-package.txt >/tmp/minion-install.out 2>/tmp/minion-install.err; then
            echo "install.sh accepted a non-.deb file" >&2
            exit 1
          fi
          grep -Fq 'não possui extensão .deb' /tmp/minion-install.err || {
            echo "install.sh did not reject the non-.deb file as expected" >&2
            cat /tmp/minion-install.err >&2
            exit 1
          }

          if grep -Eq 'go build|openssl req|systemctl enable|/etc/systemd/system' install.sh; then
            echo "install.sh reintroduced legacy installation behavior" >&2
            exit 1
          fi
          grep -Fq 'dpkg-deb -f' install.sh
          grep -Fq 'exec apt-get install -y --' install.sh

      - name: Build Debian packages
        shell: bash
        run: |
          set -euo pipefail
          PKG_VER=1.0.4 ./build_deb.sh
          PKG_VER=1.0.5 ./build_deb.sh

          cat > /tmp/minion-broken <<'EOF'
          #!/bin/sh
          exit 42
          EOF
          chmod 755 /tmp/minion-broken
          PKG_VER=1.0.6 MINION_BINARY=/tmp/minion-broken ./build_deb.sh

      - name: Validate Debian package
        shell: bash
        run: |
          set -euo pipefail
          package="./minion_1.0.5_amd64.deb"
          test -f "$package"
          test "$(dpkg-deb -f "$package" Version)" = "1.0.5"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"

          depends="$(dpkg-deb -f "$package" Depends)"
          recommends="$(dpkg-deb -f "$package" Recommends)"
          ! printf '%s\n' "$depends" | grep -Eq '(^|,)[[:space:]]*(iptables|fail2ban)([[:space:](,]|$)'
          printf '%s\n' "$recommends" | grep -Eq '(^|,)[[:space:]]*iptables([[:space:](,]|$)'
          printf '%s\n' "$recommends" | grep -Eq '(^|,)[[:space:]]*fail2ban([[:space:](,]|$)'

          root="$(mktemp -d)"
          control="$(mktemp -d)"
          dpkg-deb --extract "$package" "$root"
          dpkg-deb --control "$package" "$control"

          test -x "$root/usr/local/bin/minion"
          test -f "$root/lib/systemd/system/minion.service"
          test -f "$root/etc/minion/config.json"
          test -x "$control/preinst"
          test -x "$control/postinst"
          test -x "$control/prerm"
          test -x "$control/postrm"
          grep -qx '/etc/minion/config.json' "$control/conffiles"
          grep -q 'upgrade-backup' "$control/preinst"
          grep -q 'chmod -R go-rwx' "$control/preinst"
          grep -q 'rollback_upgrade' "$control/postinst"
          grep -q 'minion setup' "$control/postinst"
          grep -q 'systemctl is-active --quiet minion.service' "$control/postinst"
          grep -q 'STATE_DIR="/var/lib/minion"' "$control/postinst"
          grep -q 'bootstrap-credentials.txt' "$control/postinst"
          grep -q "stat -c '%u:%g:%a'" "$control/postinst"
          grep -q 'sudo minion bootstrap pair' "$control/postinst"
          grep -q 'display_host=$(hostname -I' "$control/postinst"
          grep -Fq '*:*) display_url_host="[$display_host]"' "$control/postinst"
          grep -Fq 'Address: https://${display_url_host}:${bind_port}' "$control/postinst"
          grep -q 'Service: active (minion.service)' "$control/postinst"
          grep -q 'Bootstrap credential (root-only):' "$control/postinst"
          if grep -Eq 'require_command[[:space:]]+(iptables|fail2ban-client)' "$control/postinst"; then
            echo "postinst requires optional observability commands" >&2
            exit 1
          fi
          if grep -Eq 'BOOTSTRAP_TMP|API Key:|grep[[:space:]].*BOOTSTRAP|cat[[:space:]]+.*BOOTSTRAP_FILE|minion_sk_' "$control/postinst"; then
            echo "postinst contains legacy bootstrap secret capture or exposure logic" >&2
            exit 1
          fi
          grep -q '\[ "$1" = "purge" \]' "$control/postrm"
          grep -q 'rm -rf -- /etc/minion /opt/minion /var/lib/minion' "$control/postrm"
          grep -a -q 'Bootstrap paired for' "$root/usr/local/bin/minion"

          format_url_host() {
            case "$1" in
              \[*\]) printf '%s' "$1" ;;
              *:*) printf '[%s]' "$1" ;;
              *) printf '%s' "$1" ;;
            esac
          }

          test "$(format_url_host 192.0.2.10)" = "192.0.2.10"
          test "$(format_url_host minion.internal)" = "minion.internal"
          test "$(format_url_host 2001:db8::10)" = "[2001:db8::10]"
          test "$(format_url_host '[2001:db8::10]')" = "[2001:db8::10]"
          test "$(format_url_host 127.0.0.1)" = "127.0.0.1"

      - name: Test minimal Debian installation without optional integrations
        shell: bash
        run: bash scripts/test-deb-minimal-host.sh ./minion_1.0.5_amd64.deb

      - name: Test Debian install, upgrade, rollback, removal and purge lifecycle
        shell: bash
        run: bash scripts/test-deb-lifecycle.sh ./minion_1.0.4_amd64.deb ./minion_1.0.5_amd64.deb ./minion_1.0.6_amd64.deb
