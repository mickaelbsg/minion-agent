name: Apply SQLite CLI removal

on:
  push:
    branches:
      - fix/debian-without-sqlite-cli
    paths:
      - .github/workflows/apply-sqlite-cli-removal.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debian-without-sqlite-cli
          fetch-depth: 0

      - name: Patch Debian package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_deb.sh")
          text = path.read_text()

          replacements = {
              "Depends: libc6 (>= 2.28), openssl, sqlite3, curl":
                  "Depends: libc6 (>= 2.28), openssl, curl",
              "require_command openssl\nrequire_command sqlite3\nrequire_command curl":
                  "require_command openssl\nrequire_command curl",
              '''bootstrap_client_existed=false
          if [ -f "$DATA_DIR/minion.db" ] && \\
             [ "$(sqlite3 "$DATA_DIR/minion.db" "SELECT COUNT(*) FROM clients WHERE name = 'bootstrap';" 2>/dev/null || printf '0')" -gt 0 ]; then
            bootstrap_client_existed=true
          fi''':
                  '''bootstrap_client_existed=false
          if /usr/local/bin/minion package client-exists --config "$CONFIG" --name bootstrap >/dev/null 2>&1; then
            bootstrap_client_existed=true
          else
            client_lookup_rc=$?
            if [ "$client_lookup_rc" -ne 3 ]; then
              echo "Minion could not inspect the existing bootstrap client safely." >&2
              exit "$client_lookup_rc"
            fi
          fi''',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected block not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          if "require_command sqlite3" in text or "sqlite3 \"$DATA_DIR/minion.db\"" in text:
              raise SystemExit("sqlite3 CLI dependency remained in postinst")

          path.write_text(text)
          PY

          rm -f .github/workflows/apply-sqlite-cli-removal.yml
          git config user.name "minion-maintainer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add build_deb.sh scripts/test-deb-minimal-host.sh .github/workflows/apply-sqlite-cli-removal.yml
          git commit -m "fix: instalar pacote Debian sem sqlite3 CLI"
          git push origin HEAD:fix/debian-without-sqlite-cli
