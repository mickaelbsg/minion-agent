name: Apply issue 69 patch

on:
  push:
    branches:
      - fix/debian-optional-observability-deps

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/debian-optional-observability-deps

      - name: Apply packaging changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path('build_deb.sh')
          text = build.read_text()
          text = text.replace(
              'Depends: libc6 (>= 2.28), iptables, fail2ban, openssl, sqlite3, curl\n',
              'Depends: libc6 (>= 2.28), openssl, sqlite3, curl\nRecommends: iptables, fail2ban\n',
          )
          text = text.replace('require_command iptables\nrequire_command fail2ban-client\n', '')
          build.write_text(text)

          lifecycle = Path('scripts/test-deb-lifecycle.sh')
          text = lifecycle.read_text()
          text = text.replace(
              '''assert_dependency() {
  local package="$1"
  local dependency="$2"
  dpkg-deb -f "$package" Depends | tr ',' '\\n' | grep -Eq "^[[:space:]]*${dependency}([[:space:](]|$)" || \\
    fail "$package does not declare $dependency as a package dependency"
}
''',
              '''assert_dependency() {
  local package="$1"
  local dependency="$2"
  dpkg-deb -f "$package" Depends | tr ',' '\\n' | grep -Eq "^[[:space:]]*${dependency}([[:space:](]|$)" || \\
    fail "$package does not declare $dependency as a package dependency"
}

assert_not_dependency() {
  local package="$1"
  local dependency="$2"
  if dpkg-deb -f "$package" Depends | tr ',' '\\n' | grep -Eq "^[[:space:]]*${dependency}([[:space:](]|$)"; then
    fail "$package incorrectly declares optional package $dependency as required"
  fi
}

assert_recommendation() {
  local package="$1"
  local dependency="$2"
  dpkg-deb -f "$package" Recommends | tr ',' '\\n' | grep -Eq "^[[:space:]]*${dependency}([[:space:](]|$)" || \\
    fail "$package does not recommend optional package $dependency"
}
''',
          )
          text = text.replace(
              'assert_dependency "$INSTALL_PACKAGE" "fail2ban"\nassert_dependency "$INSTALL_PACKAGE" "sqlite3"\n',
              'assert_dependency "$INSTALL_PACKAGE" "sqlite3"\nassert_not_dependency "$INSTALL_PACKAGE" "iptables"\nassert_not_dependency "$INSTALL_PACKAGE" "fail2ban"\nassert_recommendation "$INSTALL_PACKAGE" "iptables"\nassert_recommendation "$INSTALL_PACKAGE" "fail2ban"\n',
          )
          text = text.replace(
              'if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$INSTALL_PACKAGE" >"$install_output" 2>&1; then\n',
              'sudo apt-get remove -y fail2ban iptables >/dev/null 2>&1 || true\nif ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$INSTALL_PACKAGE" >"$install_output" 2>&1; then\n',
          )
          text = text.replace(
              'sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$UPGRADE_PACKAGE"\n',
              'sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$UPGRADE_PACKAGE"\n',
          )
          lifecycle.write_text(text)

          docs = Path('docs/optional-observability-dependencies.md')
          docs.write_text('''# Dependências opcionais de observabilidade\n\nA instalação base do Minion não exige `iptables` nem `fail2ban`. O pacote Debian os declara como recomendações, permitindo instalar e iniciar TLS, SQLite, bootstrap e a API principal em hosts mínimos.\n\nInstalação base sem recomendações:\n\n```bash\nsudo apt install --no-install-recommends ./minion_<versao>_amd64.deb\n```\n\nSem `iptables`, os coletores de firewall ficam indisponíveis. Sem `fail2ban`, consultas e desbloqueio controlado relacionados ao Fail2Ban ficam indisponíveis. Esses endpoints devem retornar erro explícito; o restante do agente continua operacional.\n\nPara habilitar essas capacidades posteriormente:\n\n```bash\nsudo apt install iptables fail2ban\n```\n\nA ausência desses pacotes não autoriza fallback para shell remoto, comandos livres ou scripts enviados pelo Automation/n8n.\n''')

          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text()
          needle = "          test \"$(dpkg-deb -f \"$package\" Version)\" = \"1.0.5\"\n"
          replacement = needle + "          ! dpkg-deb -f \"$package\" Depends | grep -Eq '(^|,)[[:space:]]*(iptables|fail2ban)([[:space:](]|,|$)'\n          dpkg-deb -f \"$package\" Recommends | grep -Eq '(^|,)[[:space:]]*iptables([[:space:](]|,|$)'\n          dpkg-deb -f \"$package\" Recommends | grep -Eq '(^|,)[[:space:]]*fail2ban([[:space:](]|,|$)'\n"
          text = text.replace(needle, replacement)
          workflow.write_text(text)

          Path('.github/workflows/issue69-patch.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build_deb.sh scripts/test-deb-lifecycle.sh docs/optional-observability-dependencies.md .github/workflows/ci.yml .github/workflows/issue69-patch.yml
          git commit -m "fix: tornar dependências de observabilidade opcionais"
          git push origin HEAD:fix/debian-optional-observability-deps
